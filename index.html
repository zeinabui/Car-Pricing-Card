<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Mercedus Manufacturing Website</title>
     <link rel="stylesheet" href="styles.css">
</head>
<body>
     <article class="product">
          <h2 class="p-title">Mercedus Top 2025 cars: Wanna have a ride?</h2>
          <img class="p-img" src="car.JPG" alt="A beatiful car">
          <section class="p-info">
               <div class="price-wrapper">
                    <strong><p class="price">55$.00</p></strong>
                    <p class="label">Free shipping</p>
               </div>
               <p class="description">Ready to have the most comfortable ride with your beloved ones?</p>
               <a class="more-info" href="#" target="_blank">More information &rarr;</a>
               <section class="colors">
                    <div class="color color-red"></div>
                    <div class="color color-blue"></div>
                    <div class="color color-yellow"></div>
                    <div class="color color-green"></div>
                    <div class="color color-purple"></div>
               </section>
          </section>
          <section class="p-details">
               <h3 class="p-detail">Product details</h3>
               <ul class="details">
                    <li>Budget-friendly</li>
                    <li>Luxury and beautiful</li>
                    <li>Comfortable and easy to use</li>
               </ul>
          </section>
          <button class="add-to-cart">Add to cart</button>
     </article>
     
</body>
</html>
